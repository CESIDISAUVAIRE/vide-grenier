# Environnement de PRODUCTION — 3 conteneurs (nginx + web + db)
# Projet compose : vide-grenier-prod
name: vide-grenier-prod

services:
  db:
    image: postgres:16-alpine
    container_name: vide-grenier-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: videgrenier
      POSTGRES_PASSWORD: videgrenier
      POSTGRES_DB: videgrenier
    # Les fichiers de la base sont EXPOSÉS sur l'hôte (bind mount),
    # dans un répertoire DISTINCT de celui du dev.
    volumes:
      - ./environments/prod/data/postgres:/var/lib/postgresql/data
    # PAS de port publié vers l'hôte : la base n'est accessible que via le réseau interne.
    networks:
      - vide-grenier-prod-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vide-grenier-prod-web
    restart: unless-stopped
    # PAS de bind mount du code : le code est INTÉGRÉ dans l'image (build multi-stage).
    env_file:
      - ./environments/prod/.env
    environment:
      # Connexion via le NOM DU SERVICE Docker `db`.
      DATABASE_URL: postgresql://videgrenier:videgrenier@db:5432/videgrenier
    # PAS de port publié directement : seul Nginx expose le service.
    depends_on:
      - db
    networks:
      - vide-grenier-prod-net

  nginx:
    image: nginx:1.27-alpine
    container_name: vide-grenier-prod-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Port hôte 8080 (différent du 3000 du dev pour permettre la coexistence).
    ports:
      - '8080:80'
    depends_on:
      - web
    networks:
      - vide-grenier-prod-net

networks:
  vide-grenier-prod-net:
    name: vide-grenier-prod-net
    driver: bridge